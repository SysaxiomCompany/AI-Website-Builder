<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Website Builder{% endblock %}</title>
  <meta name="description" content="Describe a website in plain English and get a responsive, editable, exportable site. Runs locally.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon-180.png') }}">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('aiwb-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    }());
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="page-{{ page|default('') }}">
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ url_for('main.builder_page') }}" aria-label="AI Website Builder home">
      <img src="{{ url_for('static', filename='img/icon-64.png') }}" alt="" width="32" height="32">
      <span>AI Website Builder</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="{{ url_for('main.builder_page') }}" {% if page == 'builder' %}aria-current="page"{% endif %}>Builder</a>
      <a href="{{ url_for('main.projects_page') }}" {% if page in ('projects', 'editor') %}aria-current="page"{% endif %}>Projects</a>
      <a href="{{ url_for('main.about_page') }}" {% if page == 'about' %}aria-current="page"{% endif %}>About the AI</a>
    </nav>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<main id="main" class="{% block main_class %}container{% endblock %}">
{% block content %}{% endblock %}
</main>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
